name: Bug Report
description: Reporte um bug ou comportamento inesperado
title: '[BUG] '
labels: ['bug', 'triagem']
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Preencha as informacoes abaixo para nos ajudar a reproduzir.
  - type: textarea
    id: description
    attributes:
      label: Descricao do bug
      description: Uma descricao clara do que aconteceu.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Lista de passos para reproduzir o comportamento.
      placeholder: |
        1. Va para '...'
        2. Clica em '....'
        3. Veja o erro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: O que voce esperava que acontecesse?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
      description: O que realmente aconteceu?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Dispositivo
      options:
        - Desktop
        - Tablet
        - Mobile
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador
      placeholder: 'Ex: Chrome 126, Firefox 127, Safari 17'
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Screenshots, logs, ou qualquer outra informacao relevante.
    validations:
      required: false
