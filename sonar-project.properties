# SonarQube Configuration -- PIANO LouvorJa Site
# Project: pianolouvorja/site
# Stack: Nuxt 4.5.1, Vue 3.5.40, TypeScript 5.9.2

# --- Project metadata ---
sonar.projectKey=pianolouvorja:site
sonar.projectName=PIANO LouvorJa Site
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# --- Source & test paths ---
sonar.sources=app
sonar.tests=test

# --- Test file detection ---
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# --- Exclusions from analysis (not counted as source) ---
sonar.exclusions=**/node_modules/**,**/.nuxt/**,**/.output/**,**/dist/**,**/coverage/**,**/*.test.*,**/*.spec.*,**/*.d.ts,**/*.stories.*

# --- Coverage exclusions (analyzed but not measured for coverage) ---
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.d.ts,**/*.config.*,app/app.vue,app/layouts/*.vue,app/pages/*.vue

# --- LCOV coverage report (vitest istanbul provider) ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# --- TypeScript / Vue analysis ---
sonar.typescript.tsconfigPath=.nuxt/tsconfig.json

# --- SCM ---
sonar.scm.provider=git

# --- Ignore duplications on generated files ---
sonar.cpd.exclusions=**/.nuxt/**,**/.output/**,**/i18n/**,**/locales/**
